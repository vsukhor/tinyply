name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}  # on all machines specified
    strategy:
        fail-fast: false
        matrix:
            config:
            - {
                name: "Ubuntu_latest_gcc-14",
                os: ubuntu-latest,
                gcc_version: 14,
                build_type: "Release",
                cc: "gcc",
                cxx: "g++",
                generators: "Ninja"
            }
            - {
                # The toolchain PPA provides gcc-16 for Ubuntu 24.04 (noble).
                name: "Ubuntu_24.04_gcc-16",
                os: ubuntu-24.04,
                gcc_version: 16,
                build_type: "Release",
                cc: "gcc",
                cxx: "g++",
                generators: "Ninja"
            }

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies on ${{ matrix.config.name }}
      if: startsWith(matrix.config.os, 'ubuntu')
      run: |
        echo =============== Install dependencies ==========================
        sudo apt-get update
        sudo apt-get install -y build-essential cmake git wget unzip
        echo =============== Prepare workspace =============================
        echo "Workspace: ${{github.workspace}}"
        echo "Build type: ${{env.BUILD_TYPE}}"
        echo "CMake generator: ${{matrix.config.generators}}"
        echo "CC: ${{matrix.config.cc}}"
        echo "CXX: ${{matrix.config.cxx}}"

        mkdir -p ${{github.workspace}}/build
        echo =============== Update gcc ======================================
        echo gcc version before:
        gcc --version
        GCC_VERSION=${{ matrix.config.gcc_version }}
        sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
        sudo apt-get update
        sudo apt-get install -y ninja-build gcc-$GCC_VERSION g++-$GCC_VERSION
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-$GCC_VERSION 91 --slave /usr/bin/g++ g++ /usr/bin/g++-$GCC_VERSION --slave /usr/bin/gcov gcov /usr/bin/gcov-$GCC_VERSION
        echo gcc version after
        gcc --version

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DBUILD_TESTS=ON

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      run: ctest --test-dir ${{github.workspace}}/build --build-config ${{env.BUILD_TYPE}} --output-on-failure
